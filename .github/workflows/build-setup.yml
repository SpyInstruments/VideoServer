name: Build Setup

on:
  workflow_dispatch:
  push:
    branches:
      - ci-setup
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Встановлюємо vswhere для пошуку шляхів
      - name: Install vswhere
        run: choco install vswhere -y

      # Знаходимо VS Developer Command Prompt і devenv.com
      - name: Setup Visual Studio paths
        run: |
          $vsPath = vswhere -latest -products * -property installationPath
          $vsDevCmd = Join-Path $vsPath "Common7\Tools\vsdevcmd.bat"
          $devenvPath = Join-Path $vsPath "Common7\IDE\devenv.com"
          echo "VSDEVCMD=$vsDevCmd" >> $env:GITHUB_ENV
          echo "DEVENV_PATH=$devenvPath" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        run: nuget restore VideoServer/VideoServer.sln

      - name: Setup VS environment
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=amd64

      - name: Fix VDPROJ Build Error (HRESULT 8000000A)
        shell: pwsh
        run: |
          # Find the Visual Studio installation path
          $vsPath = & vswhere -latest -property installationPath

          # Path to the fix utility
          $fixExe = Join-Path $vsPath "Common7\IDE\CommonExtensions\Microsoft\VSI\DisableOutOfProcBuild\DisableOutOfProcBuild.exe"
          
          if (Test-Path $fixExe) {
            Write-Host "Running DisableOutOfProcBuild.exe..."
            Start-Process -FilePath $fixExe -Wait
          } else {
            Write-Error "Fix utility not found at $fixExe"
          }

      # Build all C# projects first so every file referenced by Setup.vdproj exists in bin\Release
      # (MSBuild skips the .vdproj itself with a warning - that is expected)
      - name: Build solution (Release|x64)
        shell: pwsh
        run: |
          $msbuild = & vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\amd64\MSBuild.exe" | Select-Object -First 1
          & $msbuild "VideoServer/VideoServer.sln" /t:Build "/p:Configuration=Release;Platform=x64" /v:m /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Setup project (.vdproj)
        shell: cmd
        continue-on-error: true
        run: |
          "%DEVENV_PATH%" "VideoServer/VideoServer.sln" /build "Release|x64" /project "Setup" /out "%RUNNER_TEMP%\devenv.log"

      # devenv step is continue-on-error, so verify the installer really contains what we need
      - name: Verify installer contents
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse -Filter Setup.msi | Where-Object FullName -match '\\Release\\' | Select-Object -First 1
          if (-not $msi) {
            $log = Join-Path $env:RUNNER_TEMP "devenv.log"
            $tail = if (Test-Path $log) { (Get-Content $log | Select-String 'error|warning|Build:|Building' | Select-Object -Last 15) -join '%0A' } else { 'devenv.log not found' }
            Write-Host "::error title=Setup.msi was not built::$tail"
            exit 1
          }
          Write-Host "MSI: $($msi.FullName) ($([math]::Round($msi.Length/1MB,1)) MB)"

          $out = Join-Path $env:RUNNER_TEMP "msi_x"
          Start-Process msiexec -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$out`"" -Wait
          Get-ChildItem $out -Recurse -File | ForEach-Object { $_.FullName.Substring($out.Length + 1) }

          $required = @(
            'VideoServer.exe', 'VideoServer.exe.config', 'libvlc.zip', 'LibVLCSharp.dll',
            'Interfaces.dll', 'IPCamera.dll', 'axis.dll', 'DLink.dll', 'LocalCapture.dll', 'Panasonic.dll',
            'AForge.dll', 'AForge.Video.dll', 'AForge.Video.DirectShow.dll',
            'Microsoft.Web.WebView2.Core.dll', 'Microsoft.Web.WebView2.WinForms.dll',
            'runtimes\win-x64\native\WebView2Loader.dll'
          )
          $missing = @($required | Where-Object { $r = $_; -not (Get-ChildItem $out -Recurse -File | Where-Object { $_.FullName.EndsWith('\' + $r) }) })
          if ($missing.Count) { Write-Host ("::error title=Missing in MSI::" + ($missing -join ', ')); exit 1 }
          Write-Host "All required files are in the installer"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            **/Release/Setup.msi
            **/Release/setup.exe


      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/Release/Setup.msi
            **/Release/setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN}}
